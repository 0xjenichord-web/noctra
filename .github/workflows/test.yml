name: Node.js CI & SARIF Generation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Tests (Verbose)
      run: npm test -- --reporter=spec

    - name: Make CLI executable
      run: chmod +x bin/noctra.mjs

    - name: Run Noctra Scanner (Generate SARIF)
      run: ./bin/noctra.mjs scan ./test-project --format sarif --output noctra-report.sarif

    - name: Upload SARIF Report as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: noctra-security-report
        path: noctra-report.sarif
        retention-days: 7
